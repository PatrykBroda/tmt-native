<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"  result="b0"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"  result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="b2raw"/>
      <feColorMatrix in="b2raw" type="matrix"
        values="0.75 0 0.9  0 0.05
                0.82 0 0.95 0 0.08
                1    0 1    0 0.15
                0    0 0    0.85 0"
        result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="40" result="b3raw"/>
      <feColorMatrix in="b3raw" type="matrix"
        values="0.4 0 0.6 0 0
                0.5 0 0.7 0 0
                0.8 0 1   0 0
                0   0 0   0.45 0"
        result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="b0"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neon-fill" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#000000"/>

  <!-- Outer neon halo pass -->
  <text
    x="256" y="335"
    text-anchor="middle"
    font-family="'Arial Black','Arial Bold',Impact,'Franklin Gothic Heavy',sans-serif"
    font-size="185"
    font-weight="900"
    fill="none"
    stroke="white"
    stroke-width="14"
    stroke-linejoin="round"
    letter-spacing="12"
    filter="url(#neon)"
  >TMT</text>

  <!-- Inner crisp pass -->
  <text
    x="256" y="335"
    text-anchor="middle"
    font-family="'Arial Black','Arial Bold',Impact,'Franklin Gothic Heavy',sans-serif"
    font-size="185"
    font-weight="900"
    fill="none"
    stroke="white"
    stroke-width="2"
    stroke-linejoin="round"
    letter-spacing="12"
    filter="url(#neon-fill)"
  >TMT</text>
</svg>
