<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320">
  <defs>
    <!--
      Multi-layer neon glow replicating the TMT logo:
      core white → tight white bloom → medium cyan haze → wide dim cyan corona
    -->
    <filter id="neon" x="-45%" y="-45%" width="190%" height="190%">

      <!-- Layer 1: tight inner bloom -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b0"/>

      <!-- Layer 2: mid white glow -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="7"   result="b1"/>

      <!-- Layer 3: wide cyan haze -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="18"  result="b2raw"/>
      <feColorMatrix in="b2raw" type="matrix"
        values="0.75 0  0.9  0 0.05
                0.82 0  0.95 0 0.08
                1    0  1    0 0.15
                0    0  0    0.85 0"
        result="b2"/>

      <!-- Layer 4: very wide dim corona -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="36"  result="b3raw"/>
      <feColorMatrix in="b3raw" type="matrix"
        values="0.4 0 0.6 0 0
                0.5 0 0.7 0 0
                0.8 0 1   0 0
                0   0 0   0.45 0"
        result="b3"/>

      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="b0"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Tighter glow for the inner solid fill — keeps core crisp -->
    <filter id="neon-fill" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pure black background -->
  <rect width="960" height="320" fill="#000000"/>

  <!--
    Outer glow pass: thick stroke, no fill, heavy blur → the neon halo
    Using stroke-only with a wide blur creates the "neon tube" look
  -->
  <text
    x="480" y="268"
    text-anchor="middle"
    font-family="'Arial Black','Arial Bold',Impact,'Franklin Gothic Heavy',sans-serif"
    font-size="250"
    font-weight="900"
    fill="none"
    stroke="white"
    stroke-width="18"
    stroke-linejoin="round"
    letter-spacing="18"
    filter="url(#neon)"
  >TMT</text>

  <!--
    Inner crisp pass: same geometry, no blur — keeps the white core sharp
    so the letter edges read as solid neon tube walls
  -->
  <text
    x="480" y="268"
    text-anchor="middle"
    font-family="'Arial Black','Arial Bold',Impact,'Franklin Gothic Heavy',sans-serif"
    font-size="250"
    font-weight="900"
    fill="none"
    stroke="white"
    stroke-width="2"
    stroke-linejoin="round"
    letter-spacing="18"
    filter="url(#neon-fill)"
  >TMT</text>
</svg>
